name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  check:
    name: Check deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax and deployment scenarios
        run: |
          bash -n deploy/deploy.sh
          python3 -m unittest discover -s tests -v

  deploy:
    name: Deploy to VPS
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the commit over SSH and verify HTTPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. See README.md."
              exit 1
            fi
          done
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          # An old rerun must not overwrite a newer main deployment.
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo 'Deployment skipped: main has a newer commit.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          umask 077
          ssh_directory="$(mktemp -d "$RUNNER_TEMP/vps-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_directory"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$ssh_directory/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_directory/key" > /dev/null

          # Use a dedicated user who owns the site directory and has no sudo.
          ssh -T -p "$VPS_PORT" -l "$VPS_USER" \
            -i "$ssh_directory/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_directory/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -- "$VPS_HOST" "bash -s -- $GITHUB_SHA" < deploy/deploy.sh

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "https://vbytsyuk.ru/?deploy=$GITHUB_SHA" \
            --output "$RUNNER_TEMP/deployed-index.html"
          cmp release/index.html "$RUNNER_TEMP/deployed-index.html"
          echo "Published commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified: https://vbytsyuk.ru/' >> "$GITHUB_STEP_SUMMARY"
