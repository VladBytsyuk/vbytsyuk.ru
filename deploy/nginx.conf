# HTTP configuration for vbytsyuk.ru. Enable HTTPS after DNS points to the VPS.
server {
    listen 80;
    listen [::]:80;
    server_name vbytsyuk.ru www.vbytsyuk.ru;

    root /var/www/vbytsyuk.ru/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        expires -1;
    }

    location ~* \.(css|js|svg|jpg|ttf|pdf)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
